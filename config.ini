# iRacing Overlay Configuration
# Copy this file to config.local.ini and customize as needed

[display]
# Window dimensions
width = 400
height = 300

# Window transparency (0.0 to 1.0)
alpha = 0.8

# Update interval in seconds
update_interval = 0.1

[telemetry]
# Connection timeout in seconds
connection_timeout = 30

# Auto-reconnect on disconnect
auto_reconnect = true

[appearance]
# Color scheme (hex colors)
background_color = #000000
text_color = #cccccc
highlight_color = #00ff00
title_color = #00ff00

# Font settings
font_family = Arial
font_size = 10
title_font_size = 14
